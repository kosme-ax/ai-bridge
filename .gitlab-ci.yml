# GitLab 보안 템플릿 + sme-ax-helper 테스트
# SAST: https://docs.gitlab.com/user/application_security/sast/
# Secret Detection: https://docs.gitlab.com/user/application_security/secret_detection/

stages:
  - test
  - secret-detection
  - package

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  SECRET_DETECTION_ENABLED: "true"

cache:
  paths:
    - .cache/pip
    - .venv/

include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml

sast:
  stage: test

secret_detection:
  stage: secret-detection

app-test:
  stage: test
  image: python:3.12-slim
  script:
    - python -m venv .venv
    - source .venv/bin/activate
    - pip install -r requirements.txt
    - python -c "from src.config import MODELS; assert 'Solar' in MODELS and 'Gemini' in MODELS"
    - python -c "from src.llm import generate_json; r=generate_json('Solar','diagnosis','키워드: diagnosis\n테스트', '한빛'); assert 'summary' in r"
  rules:
    - if: $CI_PIPELINE_SOURCE

# GitLab Pages는 Streamlit에 부적합. 이미지 빌드만 수동 검증.
docker-build:
  stage: package
  image: docker:24
  services:
    - docker:24-dind
  script:
    - docker build -t sme-ax-helper:$CI_COMMIT_SHORT_SHA .
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
